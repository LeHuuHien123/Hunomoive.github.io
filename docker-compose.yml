version: '3.8'

services:
  # ================= Dịch vụ Database PostgreSQL =================
  db:
    image: postgres:16-alpine
    container_name: hunomovie_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hunomovie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # ================= Dịch vụ quản lý DB (pgAdmin) =================
  pgadmin:
    image: dpage/pgadmin4
    container_name: huno_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@huno.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always

  # ================= Dịch vụ Backend (NodeJS) =================
  backend:
    build: ./backend
    container_name: hunomovie-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/hunomovie
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Chỉ đồng bộ folder uploads nếu thư mục backend/public/uploads có tồn tại trên máy ông
      - ./backend/public/uploads:/app/public/uploads
    depends_on:
      - db
    restart: always

  # ================= Dịch vụ Frontend =================
  frontend:
    build: ./frontend
    container_name: huno_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    depends_on:
      - backend
    restart: always

# Khai báo volume cho Database
volumes:
  postgres_data: